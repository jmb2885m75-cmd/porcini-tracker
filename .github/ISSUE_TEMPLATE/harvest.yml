name: Mushroom observation
description: Log a porcini harvest or a visit where no mushrooms were found. Only issues from the repository owner or collaborators are ingested.
title: "Observation: "
labels: ["harvest"]
body:
  - type: markdown
    attributes:
      value: |
        **Quick log:** pick the spot, leave the date empty for today, choose what you found and submit.
        For "No mushrooms found" you only need the spot and (optionally) a date or note. The dashboard's *Log Field Observation* form can pre-fill this page for you.
  # BEGIN LOCATION FIELD
  - type: dropdown
    id: location
    attributes:
      label: Location / spot
      description: Pick the spot you visited.
      options:
        - "Fangschleuse"
        - "Zosse"
    validations:
      required: true
  # END LOCATION FIELD
  - type: input
    id: date
    attributes:
      label: Date
      description: Leave empty for today. Or type today, yesterday, YYYY-MM-DD or DD.MM.YYYY.
      placeholder: today
  - type: dropdown
    id: observation_type
    attributes:
      label: Observation type
      options:
        - Found mushrooms
        - No mushrooms found
      default: 0
    validations:
      required: true
  - type: dropdown
    id: yield_tier
    attributes:
      label: Yield tier
      description: Only needed when mushrooms were found.
      options:
        - Small
        - Medium
        - Large
  - type: dropdown
    id: cap_stage
    attributes:
      label: Cap stage
      description: Only needed when mushrooms were found.
      options:
        - Buttons / young
        - Prime
        - Old / overripe
  - type: input
    id: weight_g
    attributes:
      label: Weight (g)
      description: Optional, found mushrooms only. A number of grams, e.g. 450 (1.2 kg also works).
      placeholder: "450"
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Optional
