name: Harvest Intake

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: porcini-state
  cancel-in-progress: false

jobs:
  ingest:
    # Only the owner, org members and collaborators may create accepted harvest records.
    if: >-
      contains(github.event.issue.labels.*.name, 'harvest') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Create config.json from GitHub Secrets
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
        run: |
          if [ -n "$CONFIG_JSON" ]; then printf '%s' "$CONFIG_JSON" > config.json; fi

      - name: Validate and ingest issue
        id: ingest
        continue-on-error: true
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_AUTHOR_ASSOCIATION: ${{ github.event.issue.author_association }}
          REPO_OWNER: ${{ github.repository_owner }}
          HARVEST_ERROR_FILE: ${{ runner.temp }}/harvest_error.md
        run: python harvest.py

      - name: Rescore and rebuild dashboard
        if: steps.ingest.outcome == 'success'
        run: |
          pip install requests
          python porcini.py

      - name: Refresh issue form location list
        if: steps.ingest.outcome == 'success'
        continue-on-error: true
        run: python harvest.py --sync-form

      - name: Commit updated data
        if: steps.ingest.outcome == 'success'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch alert_state.json
          git add harvest_log.json porcini_db.json index.html porcini_report.html alert_state.json .github/ISSUE_TEMPLATE/harvest.yml
          if ! git diff --cached --quiet; then
            git commit -m "🍄 Record harvest from issue #${{ github.event.issue.number }} [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi

      - name: Report result on the issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.ingest.outcome }}
          ERROR_FILE: ${{ runner.temp }}/harvest_error.md
          ISSUE: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "Observation recorded in harvest_log.json; scores and dashboard updated."
            gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY"
          else
            BODY="$RUNNER_TEMP/comment.md"
            {
              echo "### ❌ Observation was not recorded"
              echo
              if [ -s "$ERROR_FILE" ]; then
                echo "Please fix the following:"
                echo
                cat "$ERROR_FILE"
              else
                echo "The intake workflow failed before the observation could be validated (see the [workflow run]($RUN_URL))."
              fi
              echo
              echo "**How to fix:** open a new observation (the dashboard's *Log Field Observation* form pre-fills it) with the corrections above."
              echo "Tips: leave *Date* empty for today; for *No mushrooms found* only the location is needed; for *Found mushrooms* also choose a yield tier and cap stage."
              echo
              echo "[Workflow run]($RUN_URL)"
            } > "$BODY"
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$BODY"
          fi
