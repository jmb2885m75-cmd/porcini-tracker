name: Porcini Intelligence Daily Engine

on:
  schedule:
    - cron: '0 8 * * *'   # Daily run (default mode) at 08:00 UTC
    - cron: '0 18 * * 4'  # Thursday 18:00 UTC -> weekend outlook mode (porcini.py detects it from the UTC time)
    - cron: '0 6 * * 5'   # Friday 06:00 UTC -> final go/no-go confirmation mode
  workflow_dispatch:     # Allows manual triggering from the GitHub Actions tab

# One run at a time: the job rewrites and commits the shared JSON state files.
concurrency:
  group: porcini-state
  cancel-in-progress: false

jobs:
  run-porcini-engine:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Execute Porcini Evaluation Engine
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
        run: |
          python porcini.py

      - name: Commit and Push Updated Weather Database & Report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch alert_state.json
          git add porcini_db.json index.html porcini_report.html alert_state.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🍄 Auto-update Porcini weather DB & report [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi
