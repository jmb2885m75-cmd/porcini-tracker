name: Porcini Intelligence Daily Engine

on:
  schedule:
    - cron: '0 8 * * *'  # Runs daily at 08:00 UTC
  workflow_dispatch:     # Allows manual triggering from the GitHub Actions tab

jobs:
  run-porcini-engine:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Create config.json from GitHub Secrets
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
        run: |
          printf '%s' "$CONFIG_JSON" > config.json

      - name: Execute Porcini Evaluation Engine
        run: |
          python porcini.py

      - name: Commit and Push Updated Weather Database & Report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.io"
          touch alert_state.json
          git add porcini_db.json index.html porcini_report.html alert_state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🍄 Auto-update Porcini weather DB & report [skip ci]" && git push)
