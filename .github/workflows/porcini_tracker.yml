name: Porcini Intelligence Daily Engine

on:
  schedule:
    - cron: '0 8 * * *'   # Daily run (default mode) at 08:00 UTC
    - cron: '0 18 * * 4'  # Thursday 18:00 UTC -> weekend outlook mode (porcini.py detects it from the UTC time)
    - cron: '0 6 * * 5'   # Friday 06:00 UTC -> final go/no-go confirmation mode
  workflow_dispatch:     # Allows manual triggering from the GitHub Actions tab
    inputs:
      test_alert:
        description: 'Send a Telegram test alert only'
        type: boolean
        default: false

# One run at a time: the job rewrites and commits the shared JSON state files.
concurrency:
  group: porcini-state
  cancel-in-progress: false

jobs:
  run-porcini-engine:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository (code)
        uses: actions/checkout@v4

      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data
        continue-on-error: true  # Tolerate missing data branch on first run

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Porcini Evaluation Engine
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
          TEST_ALERT: ${{ inputs.test_alert }}
          DATA_DIR: data
        run: |
          if [ "$TEST_ALERT" = "true" ]; then
            python porcini.py --test-alert
          else
            python porcini.py
          fi

      - name: Commit and Push Updated Data Files
        run: |
          cd data
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch alert_state.json
          git add porcini_db.json index.html porcini_report.html alert_state.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🍄 Auto-update Porcini weather DB & report [skip ci]"
            git pull --rebase --autostash origin data
            git push origin data
          fi
