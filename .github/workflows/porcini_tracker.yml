name: Porcini Intelligence Daily Engine

on:
  schedule:
    - cron: '0 7 * * *'   # Daily run at 08:00 CET
    - cron: '0 6 * * *'   # Daily run at 08:00 CEST
    - cron: '0 17 * * 4'  # Thursday 18:00 CET -> weekend outlook
    - cron: '0 16 * * 4'  # Thursday 18:00 CEST -> weekend outlook
    - cron: '0 6 * * 5'   # Friday 07:00 CET -> final confirmation
    - cron: '0 5 * * 5'   # Friday 07:00 CEST -> final confirmation
  workflow_dispatch:     # Allows manual triggering from the GitHub Actions tab
    inputs:
      test_alert:
        description: 'Send a Telegram test alert only'
        type: boolean
        default: false

# One run at a time: the job rewrites and commits the shared JSON state files.
concurrency:
  group: porcini-state
  cancel-in-progress: false

jobs:
  run-porcini-engine:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository (code)
        uses: actions/checkout@v4

      - name: Check seasonal schedule
        id: schedule
        if: github.event_name == 'schedule'
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          expected_offsets = {
              "0 7 * * *": 1,
              "0 6 * * *": 2,
              "0 17 * * 4": 1,
              "0 16 * * 4": 2,
              "0 6 * * 5": 1,
              "0 5 * * 5": 2,
          }
          schedule = os.environ["SCHEDULE"]
          expected = expected_offsets.get(schedule)
          if expected is None:
              raise SystemExit(f"Unrecognized scheduled cron: {schedule}")
          actual = datetime.now(ZoneInfo("Europe/Berlin")).utcoffset()
          matches = actual == timedelta(hours=expected)
          print(f"{schedule}: Berlin offset {actual}; {'running' if matches else 'skipping duplicate seasonal schedule'}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run={'true' if matches else 'false'}\n")
          PY

      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data
        continue-on-error: true  # Tolerate missing data branch on first run
        if: steps.schedule.outputs.run != 'false'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
        if: steps.schedule.outputs.run != 'false'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        if: steps.schedule.outputs.run != 'false'

      - name: Execute Porcini Evaluation Engine
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
          TEST_ALERT: ${{ inputs.test_alert }}
          DATA_DIR: data
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        if: steps.schedule.outputs.run != 'false'
        run: |
          if [ "$TEST_ALERT" = "true" ]; then
            python porcini.py --test-alert
          elif [ "$EVENT_NAME" = "schedule" ]; then
            case "$SCHEDULE" in
              '0 7 * * *'|'0 6 * * *') mode=default ;;
              '0 17 * * 4'|'0 16 * * 4') mode=weekend_outlook ;;
              '0 6 * * 5'|'0 5 * * 5') mode=final_confirmation ;;
              *) echo "Unrecognized scheduled cron: $SCHEDULE" >&2; exit 1 ;;
            esac
            python porcini.py --mode "$mode"
          else
            python porcini.py
          fi

      - name: Commit and Push Updated Data Files
        if: steps.schedule.outputs.run != 'false'
        run: |
          cd data
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch alert_state.json
          for f in porcini_db.json index.html porcini_report.html alert_state.json; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🍄 Auto-update Porcini weather DB & report [skip ci]"
            if git ls-remote --exit-code --heads origin data >/dev/null; then
              git pull --rebase --autostash origin data
            else
              status=$?
              if [ "$status" -ne 2 ]; then exit "$status"; fi
              git branch -M data
            fi
            git push origin data
          fi
