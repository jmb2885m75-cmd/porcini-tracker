name: Auto-Update Porcini Report

on:
  push:
    paths:
      - 'config.json'
      - 'porcini_db.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Porcini Engine
        run: |
          python porcini.py

      - name: Commit and push updated report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.io"
          touch alert_state.json
          git add porcini_db.json index.html porcini_report.html alert_state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🍄 Auto-update Porcini weather DB & report [skip ci]" && git push)
