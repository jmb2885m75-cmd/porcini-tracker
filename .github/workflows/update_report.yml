name: Auto-Update Porcini Report

on:
  push:
    paths:
      - 'porcini.py'
      - 'porcini_db.json'
  workflow_dispatch:

permissions:
  contents: write

# Share the lock with the scheduled workflow: both rewrite and commit the same JSON files.
concurrency:
  group: porcini-state
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Porcini Engine
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
        run: |
          python porcini.py

      - name: Commit and push updated report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch alert_state.json
          git add porcini_db.json index.html porcini_report.html alert_state.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🍄 Auto-update Porcini weather DB & report [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi
